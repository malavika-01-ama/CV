bio: >-
  Hi! I'm Malavika, a final-year BS-MS student at the Indian Institute of
  Science Education and Research (IISER) Tirupati, doing my thesis in the
  Sciurid Lab. I'm interested in population-level and community-level
  differences and interactions in ecosystems, and I use genomic tools and
  empirical models to study them. This led me to study patterns of adaptation
  and selection under anthropogenic stress. My thesis work involves expanding
  genomic resources for Indian squirrels and identifying adaptations to human
  pressures using genomics.

